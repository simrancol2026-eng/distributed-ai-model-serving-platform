spring.application.name=spring-boot

# --- Model workers ---
# One worker: base URL of the Python worker (model-workers/model-a). Env var PLATFORM_WORKER_URL.
platform.worker.url=${PLATFORM_WORKER_URL:http://localhost:8001}
# Several workers (Sprint 2): comma-separated URLs, served round-robin in this order.
# Env var PLATFORM_WORKER_URLS, e.g. http://localhost:8001,http://localhost:8002
# If it is not set, the single platform.worker.url above is the only worker.
platform.worker.urls=${PLATFORM_WORKER_URLS:${platform.worker.url}}
# Capability all workers serve (the unified API rejects requests for other capabilities).
platform.worker.capability=TEXT
platform.worker.connect-timeout-ms=2000
# First inference after start-up can be slow on CPU; keep this generous.
platform.worker.read-timeout-ms=30000

# --- Sprint 3: routing policy (see docs/SPRINT3_ROUTING.md and DECISIONS.md D-045..D-047) ---
# Chosen once at startup; env var PLATFORM_ROUTING_POLICY. Case-sensitive; an unknown value stops startup.
#   ROUND_ROBIN      default and comparison baseline
#   LEAST_IN_FLIGHT  fewest requests in progress from this backend, ties rotated
#   HEALTH_LATENCY   skip workers failing background /health checks; lowest (inFlight + 1) x estimated latency
# Left commented so the code default (ROUND_ROBIN in WorkerPool) applies unchanged:
#platform.routing.policy=${PLATFORM_ROUTING_POLICY:ROUND_ROBIN}
# HEALTH_LATENCY derives its health freshness window from platform.worker.probe-timeout-ms (default 2000).

# --- Sprint 2: model registry database (PostgreSQL) ---
# Set these as environment variables; never commit real credentials.
# The database and role must already exist (see scripts/setup_registry_db.sh). Flyway then
# creates/updates the tables from src/main/resources/db/migration on startup. Flyway never drops data.
spring.datasource.url=${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
spring.datasource.username=${PLATFORM_DB_USER:platform}
spring.datasource.password=${PLATFORM_DB_PASSWORD:}
spring.flyway.clean-disabled=true
# How long a request may wait for a database connection (Hikari default is 30 s). Kept short so an
# unreachable database gives a fast 503 (registry) or a skipped tracking write, not a 30 s stall.
spring.datasource.hikari.connection-timeout=${PLATFORM_DB_CONNECT_TIMEOUT_MS:2000}

# --- Sprint 2: request lifecycle tracking ---
# Each tracking SQL statement is cancelled after this many seconds (slow DB or a held table lock).
platform.tracking.statement-timeout-seconds=2
# After a failed tracking write, skip new tracking writes for this long, then let one write probe
# the database at a time (see TrackingGate). 0 = never pause.
platform.tracking.pause-after-failure-ms=10000

# Backend HTTP port (default 8080); override with PLATFORM_BACKEND_PORT.
server.port=${PLATFORM_BACKEND_PORT:8080}

# --- CORS: which browser origins may call /api/** (comma-separated). ---
platform.cors.allowed-origins=${PLATFORM_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
