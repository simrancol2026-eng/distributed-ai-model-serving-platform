# Test-only overrides. Spring Boot loads classpath:/config/application.properties AFTER
# classpath:/application.properties, so these lines win during `mvnw test` while every other
# property (worker URL, CORS, ...) still comes from src/main/resources/application.properties.
#
# Tests use an in-memory H2 database in PostgreSQL compatibility mode. Results from these tests are
# H2 evidence only; they do not prove behaviour on a real PostgreSQL server.
spring.datasource.url=jdbc:h2:mem:registry;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
